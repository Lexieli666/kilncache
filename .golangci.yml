# Linters are chosen for the failure modes this project actually has:
# bodyclose  - every forwarded PUT/GET opens a peer response that must be closed
#              or the node leaks file descriptors under load;
# errcheck   - an ignored fsync or rename error is how a cache silently
#              publishes a partial object;
# staticcheck/gocritic - general correctness and readability;
# govet      - copylocks and printf, which bite in concurrent code.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - bodyclose
    - misspell
    - unconvert
    - nolintlint

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam        # config.Config is copied by value on purpose
      - rangeValCopy
      - unnamedResult
      - whyNoLint
  govet:
    enable:
      - copylocks
      - printf
      - nilness
  nolintlint:
    require-explanation: true
    require-specific: true
    allow-unused: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test helpers legitimately ignore errors on cleanup paths.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
